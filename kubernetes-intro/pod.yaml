apiVersion: v1
kind: Pod
metadata:
  name: homework
  namespace: homework
spec:
  initContainers:
  - name: html-generator
    image: busybox:1.36
    command: ['sh', '-c', 'echo "<h1>Hello from otus-kubernetes!</h1>" > /init/index.html']
    volumeMounts:
    - name: html-data
      mountPath: /init
  containers:
  - name: web-server
    image: python:3.11-slim
    command: ['python3', '-m', 'http.server', '8000', '--directory', '/homework']
    ports:
    - containerPort: 8000
    volumeMounts:
    - name: html-data
      mountPath: /homework
    lifecycle:
      preStop:
        exec:
          command: ['rm', '-f', '/homework/index.html']

  volumes:
  - name: html-data
    emptyDir: {}

