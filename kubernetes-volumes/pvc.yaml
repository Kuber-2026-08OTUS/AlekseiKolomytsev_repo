apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: homework-pvc
  namespace: homework
  labels:
    app: homework
spec:
  storageClassName: minikube-retain-sc #если хотим дефолтное, то storageClassName не указываем
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi