apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
    name: {{ include "homework.fullname" . }}-metrics-binding
    labels:
    {{- include "homework.labels" . | nindent 4 }}
subjects:
    - kind: ServiceAccount
    name: {{ include "homework.saName" . }}
    namespace: {{ .Release.Namespace }}
roleRef:
    kind: ClusterRole
    name: {{ include "homework.fullname" . }}-metrics-reader
    apiGroup: rbac.authorization.k8s.io