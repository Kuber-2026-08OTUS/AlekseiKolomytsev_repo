apiVersion: apps/v1
kind: Deployment
metadata:
  name: my-custom-operator
  namespace: homework
spec:
  replicas: 1
  selector:
    matchLabels:
      app: my-custom-operator
  template:
    metadata:
      labels:
        app: my-custom-operator
    spec:
      serviceAccountName: my-custom-operator-sa
      containers:
        - name: operator
          image: akolomytsev/mysql-handler-operator:latest
          imagePullPolicy: Never 
